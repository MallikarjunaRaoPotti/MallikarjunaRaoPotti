<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Mallikarjuna Rao Potti, Data Engineer</title>
  <desc id="desc">Data engineer working on pipelines, analytics and applied ML. A medallion pipeline moves data from raw to bronze, silver and gold, which then feeds dashboards, forecasts and ML models.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.08" cy="0" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.95" cy="1" r="0.65">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6EDF3" stroke-opacity="0.035"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="460" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { stroke-dasharray: 3 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.65; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#0D1117"/>
    <rect width="1200" height="460" fill="url(#grid)"/>
    <rect width="1200" height="460" fill="url(#glowCyan)"/>
    <rect width="1200" height="460" fill="url(#glowViolet)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="23.5" fill="none" stroke="#30363D"/>

  <!-- Identity -->
  <text x="64" y="100" class="mono" font-size="16" letter-spacing="4" fill="#22D3EE">DATA ENGINEER · ANALYTICS · APPLIED ML</text>
  <text x="61" y="180" class="sans" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#E6EDF3">Mallikarjuna</text>
  <text x="61" y="256" class="sans" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#accent)">Rao Potti</text>
  <text class="sans" font-size="19" fill="#8B949E">
    <tspan x="64" y="306">I build the data pipeline first, so the dashboard, the</tspan>
    <tspan x="64" y="334">forecast or the model on top of it can actually be trusted.</tspan>
  </text>

  <!-- Credentials -->
  <g>
    <rect x="64" y="374" width="340" height="40" rx="20" fill="#161B22" stroke="#30363D"/>
    <circle cx="90" cy="394" r="9" fill="none" stroke="#22D3EE" stroke-width="1.8"/>
    <path d="M85.8 394.2l2.9 2.9 5.6-5.8" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="399" class="sans" font-size="15" fill="#C9D1D9">Engineering Intern · iCustomer · 2026</text>

    <rect x="418" y="374" width="440" height="40" rx="20" fill="#161B22" stroke="#F5B942" stroke-opacity="0.45"/>
    <text x="638" y="399" class="sans" font-size="15" fill="#C9D1D9" text-anchor="middle">Microsoft Certified: Fabric Data Engineer Associate</text>

    <rect x="872" y="374" width="250" height="40" rx="20" fill="#161B22" stroke="#30363D"/>
    <text x="997" y="399" class="sans" font-size="15" fill="#C9D1D9" text-anchor="middle">B.Tech CS &amp; IT · CGPA 8.4</text>
  </g>

  <!-- Medallion pipeline -->
  <g>
    <rect x="720" y="56" width="424" height="280" rx="16" fill="#161B22" fill-opacity="0.85" stroke="#30363D"/>
    <circle cx="744" cy="82" r="5.5" fill="#F85149" fill-opacity="0.8"/>
    <circle cx="762" cy="82" r="5.5" fill="#D29922" fill-opacity="0.8"/>
    <circle cx="780" cy="82" r="5.5" fill="#3FB950" fill-opacity="0.8"/>
    <text x="800" y="87" class="mono" font-size="13" fill="#8B949E">medallion_pipeline · databricks</text>
    <line x1="720" y1="104" x2="1144" y2="104" stroke="#30363D"/>

    <!-- connectors -->
    <g stroke-width="2" fill="none">
      <path d="M806 162H850M910 162H954M1014 162H1058" stroke="#30363D"/>
      <path d="M806 162H850M910 162H954M1014 162H1058" stroke="#22D3EE" class="flow"/>
      <path d="M1114 162H1130Q1134 162 1134 166V250Q1134 254 1130 254H808M808 254V270M932 254V270M1056 254V270" stroke="#30363D"/>
      <path d="M1114 162H1130Q1134 162 1134 166V250Q1134 254 1130 254H808M808 254V270M932 254V270M1056 254V270" stroke="#A78BFA" class="flow"/>
    </g>

    <!-- nodes -->
    <circle cx="776" cy="162" r="26" fill="#8B949E" fill-opacity="0.12" stroke="#8B949E" stroke-width="2"/>
    <circle cx="776" cy="162" r="8" fill="#8B949E"/>
    <circle cx="880" cy="162" r="26" fill="#CD7F32" fill-opacity="0.12" stroke="#CD7F32" stroke-width="2"/>
    <circle cx="880" cy="162" r="8" fill="#CD7F32"/>
    <circle cx="984" cy="162" r="26" fill="#C0C7D0" fill-opacity="0.12" stroke="#C0C7D0" stroke-width="2"/>
    <circle cx="984" cy="162" r="8" fill="#C0C7D0"/>
    <circle cx="1088" cy="162" r="34" fill="#F5B942" filter="url(#blur)" class="pulse"/>
    <circle cx="1088" cy="162" r="26" fill="#F5B942" fill-opacity="0.14" stroke="#F5B942" stroke-width="2"/>
    <circle cx="1088" cy="162" r="8" fill="#F5B942"/>

    <g class="mono" font-size="12" letter-spacing="2" fill="#E6EDF3" text-anchor="middle" font-weight="600">
      <text x="776" y="210">RAW</text>
      <text x="880" y="210">BRONZE</text>
      <text x="984" y="210">SILVER</text>
      <text x="1088" y="210">GOLD</text>
    </g>
    <g class="mono" font-size="11" fill="#8B949E" text-anchor="middle">
      <text x="776" y="228">csv files</text>
      <text x="880" y="228">delta tables</text>
      <text x="984" y="228">clean · typed</text>
      <text x="1088" y="228">star schema</text>
    </g>

    <!-- consumers -->
    <g class="mono" font-size="12" letter-spacing="1.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">
      <rect x="752" y="270" width="112" height="30" rx="8" fill="#0D1117" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="808" y="290">DASHBOARD</text>
      <rect x="876" y="270" width="112" height="30" rx="8" fill="#0D1117" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="932" y="290">FORECAST</text>
      <rect x="1000" y="270" width="112" height="30" rx="8" fill="#0D1117" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="1056" y="290">ML MODEL</text>
    </g>
  </g>
</svg>
