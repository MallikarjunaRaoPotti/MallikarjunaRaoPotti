<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Job Application Agent: first full day</title>
  <desc id="desc">1,053 LinkedIn search hits, 544 jobs tracked after skipping 360 senior titles, 226 jobs scored after 304 were screened out, and 6 verified top matches with a fit score above 9.0 that were still open.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6EDF3" stroke-opacity="0.03"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="330" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { stroke-dasharray: 3 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="#0D1117"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="19.5" fill="none" stroke="#30363D"/>

  <text x="64" y="48" class="mono" font-size="12" letter-spacing="3" fill="#8B949E">JOB APPLICATION AGENT · FIRST FULL DAY</text>
  <text x="1136" y="48" class="mono" font-size="12" fill="#6E7681" text-anchor="end">numbers from the project README</text>

  <g class="mono" font-size="12" letter-spacing="2.5" font-weight="600" text-anchor="middle">
    <text x="192" y="94" fill="#22D3EE">01 · DISCOVER</text>
    <text x="464" y="94" fill="#48B8F2">02 · FETCH DETAILS</text>
    <text x="736" y="94" fill="#7AA0F7">03 · SCREEN + SCORE</text>
    <text x="1008" y="94" fill="#A78BFA">04 · VERIFY OPEN</text>
  </g>

  <line x1="64" y1="176" x2="1136" y2="176" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2" class="flow"/>

  <rect x="64" y="106" width="256" height="140" rx="14" fill="#0F242D" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="336" y="120" width="256" height="112" rx="14" fill="#13222D" stroke="#48B8F2" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="608" y="134" width="256" height="84" rx="14" fill="#181F2D" stroke="#7AA0F7" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="890" y="138" width="236" height="76" rx="18" fill="#A78BFA" filter="url(#blur)" class="pulse"/>
  <rect x="880" y="148" width="256" height="56" rx="14" fill="#1A1530" stroke="#A78BFA" stroke-width="1.5"/>

  <g fill="#30363D">
    <path d="M325 170l6 6-6 6" stroke="#6E7681" stroke-width="2" fill="none"/>
    <path d="M597 170l6 6-6 6" stroke="#6E7681" stroke-width="2" fill="none"/>
    <path d="M869 170l6 6-6 6" stroke="#6E7681" stroke-width="2" fill="none"/>
  </g>

  <g class="sans" font-weight="800" fill="#E6EDF3" text-anchor="middle">
    <text x="192" y="190" font-size="42">1,053</text>
    <text x="464" y="190" font-size="42">544</text>
    <text x="736" y="190" font-size="40">226</text>
    <text x="1008" y="189" font-size="36">6</text>
  </g>

  <g class="sans" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="middle">
    <text x="192" y="276">LinkedIn search hits</text>
    <text x="464" y="276">jobs tracked</text>
    <text x="736" y="276">jobs scored</text>
    <text x="1008" y="276">verified top matches</text>
  </g>
  <g class="sans" font-size="13" fill="#8B949E" text-anchor="middle">
    <text x="192" y="300">last 24 h · spend-capped search</text>
    <text x="464" y="300">360 senior titles skipped first</text>
    <text x="736" y="300">304 screened out before any LLM call</text>
    <text x="1008" y="300">fit score &gt; 9.0 and still open</text>
  </g>
</svg>
